
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      PRODUCT_SERVICE_URL: http://product-service:3001
    depends_on:
      mongo:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/kyro_products
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - kyro-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kyro-mongo-data:
