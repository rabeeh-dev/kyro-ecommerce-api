services:
  order-service:
    build: ./services/order-service
    # ports:
    #   - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ecommerce
      PRODUCT_SERVICE_URL: http://product-service:3001
      INVENTORY_GRPC_URL: inventory-service:50051
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    # ports:
    #   - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/kyro_products
    depends_on:
      mongo:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-services
    # ports:
    #   - "3002:3002"
    #   - "50051:50051"
    environment:
      PORT: 3002
      GRPC_PORT: 50051
      MONGODB_URI: mongodb://mongo:27017/kyro_inventory
    depends_on:
      mongo:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build: 
      context: ./services/analytics-service
    container_name: analytics-service
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "4000:4000" # ONLY the Gateway is exposed to your laptop/frontend
    depends_on:
      - order-service
      - product-service
      - inventory-service

  # IMPORTANT SECURITY UPDATE:
  # Go to your 'api', 'product-service', and 'inventory-service' blocks 
  # and DELETE their "ports:" definitions! They should only talk internally.

  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Enable KRaft mode (No Zookeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Configure how services talk to Kafka inside the Docker network
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single-node cluster settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - kyro-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kyro-mongo-data:
